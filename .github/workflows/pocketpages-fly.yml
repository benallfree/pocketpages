name: Publish pocketpages-fly image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/pocketpages-fly/**'
      - '.github/workflows/pocketpages-fly.yml'
  workflow_dispatch:
    inputs:
      pb_version:
        description: 'PocketBase version to build (defaults to PB_VERSION in the Dockerfile)'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pick the PocketBase version
        id: version
        run: |
          version="${{ inputs.pb_version }}"
          if [ -z "$version" ]; then
            version=$(sed -n 's/^ARG PB_VERSION=//p' docker/pocketpages-fly/Dockerfile)
          fi
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: docker/pocketpages-fly
          platforms: linux/amd64,linux/arm64
          build-args: PB_VERSION=${{ steps.version.outputs.full }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pocketpages-fly:${{ steps.version.outputs.full }}
            ghcr.io/${{ github.repository_owner }}/pocketpages-fly:${{ steps.version.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/pocketpages-fly:latest
